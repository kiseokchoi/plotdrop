[package]
name = "plotsift"
version = "0.1.0"
description = "Local-first graph digitizer for research data and error bars"
authors = ["K. S. Choi"]
edition = "2021"
rust-version = "1.77.2"
license = "Apache-2.0"

[lib]
name = "plotsift_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
